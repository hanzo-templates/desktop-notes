[package]
name = "desktop-notes"
version = "0.1.0"
edition = "2021"
description = "Local-first markdown notes — one .md file per note in the OS app-data dir, live preview, optional Base sync."
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
